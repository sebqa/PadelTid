name: Deploy Lambda Functions

on:
  push:
    branches: [ master ]
    paths:
      - 'functions/**'

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [
          {
            name: 'getCourts',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'getPadelTid',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'getWeather',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'subTopic',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'sendNotification',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'getClubs',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'manageTokens',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'getDocumentById',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'checkSubscription',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'createSubscription',
            handler: 'lambda_function.lambda_handler'
          },
          {
            name: 'cancelSubscription',
            handler: 'lambda_function.lambda_handler'
          }
        ]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies for ${{ matrix.function.name }}
      run: |
        cd functions/${{ matrix.function.name }}
        if [ -f requirements.txt ]; then
          # For sendNotification, install only essential dependencies
          if [ "${{ matrix.function.name }}" = "sendNotification" ]; then
            pip install -r requirements.txt --no-deps -t .
            pip install boto3 requests -t .
          else
            pip install -r requirements.txt -t .
          fi
        fi
        
    - name: Copy credentials if needed
      run: |
        if [ -d "functions/credentials" ]; then
          cp -r functions/credentials functions/${{ matrix.function.name }}/
        fi
      
    - name: Clean up unnecessary files
      run: |
        cd functions/${{ matrix.function.name }}
        # Remove unnecessary files to reduce package size
        find . -type d -name "__pycache__" -exec rm -rf {} +
        find . -type d -name "*.dist-info" -exec rm -rf {} +
        find . -type d -name "*.egg-info" -exec rm -rf {} +
        find . -type f -name "*.pyc" -delete
        find . -type f -name "*.pyo" -delete
        find . -type f -name "*.pyd" -delete
        find . -type f -name "*.so" -delete
        find . -type f -name "*.dylib" -delete
        find . -type f -name "*.dll" -delete
        
    - name: Zip function
      run: |
        cd functions/${{ matrix.function.name }}
        zip -r ../../${{ matrix.function.name }}.zip .
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1
        
    - name: Update Lambda
      run: |
        aws lambda update-function-code \
          --function-name ${{ matrix.function.name }} \
          --zip-file fileb://${{ matrix.function.name }}.zip 