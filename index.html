  <script>
    // Bridge between service worker and Flutter
    (function() {
      let lastDocumentId = null;
      let lastClickTime = 0;
      const debounceTime = 3000; // 3 seconds
      
      window.addEventListener('message', function(event) {
        console.log('Window received message:', event.data);
        
        // Check if this is a notification click
        if (event.data && event.data.type === 'NOTIFICATION_CLICK') {
          const documentId = event.data.documentId;
          const now = Date.now();
          
          // Debounce duplicate clicks
          if (documentId === lastDocumentId && now - lastClickTime < debounceTime) {
            console.log('Debouncing duplicate notification click for document:', documentId);
            return;
          }
          
          // Update tracking variables
          lastDocumentId = documentId;
          lastClickTime = now;
          
          // If Flutter is ready, call the handler directly
          if (window.handleNotificationClick) {
            window.handleNotificationClick(documentId);
          } else {
            // Store the message to process when Flutter is ready
            window.pendingNotificationClick = documentId;
          }
        }
      });
      
      // Also listen for service worker messages
      if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function(event) {
          console.log('Service worker message received:', event.data);
          // Forward to window message handler
          window.dispatchEvent(new MessageEvent('message', {
            data: event.data
          }));
        });
      }
    })();

  <script>
    // Function to check for background notifications
    window.checkForBackgroundNotifications = function() {
      if (!window.indexedDB) {
        console.log('IndexedDB not supported');
        return;
      }
      
      const DB_NAME = 'notifications_db';
      const STORE_NAME = 'background_notifications';
      
      const request = indexedDB.open(DB_NAME, 1);
      
      request.onerror = function(event) {
        console.error('Error opening IndexedDB:', event.target.error);
      };
      
      request.onsuccess = function(event) {
        const db = event.target.result;
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        
        const getAllRequest = store.getAll();
        
        getAllRequest.onsuccess = function(event) {
          const notifications = event.target.result;
          console.log(`Found ${notifications.length} background notifications to process`);
          
          // Process each notification
          if (notifications.length > 0) {
            const deleteRequests = [];
            
            notifications.forEach(function(notification) {
              // Pass to Flutter
              if (window.processBackgroundNotification) {
                window.processBackgroundNotification(JSON.stringify(notification));
                
                // Mark as processed by deleting
                const deleteRequest = store.delete(notification.id);
                deleteRequests.push(deleteRequest);
              }
            });
            
            // Wait for all deletes to complete
            Promise.all(deleteRequests.map(req => new Promise((resolve) => {
              req.onsuccess = resolve;
            }))).then(() => {
              console.log('All notifications processed and removed');
            });
          }
        };
        
        getAllRequest.onerror = function(event) {
          console.error('Error getting notifications:', event.target.error);
        };
      };
    };
    
    // Check if service worker is active and supports background sync
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function(registration) {
        console.log('Service worker is ready');
      });
    }

  <script>
    // Function to migrate notifications from IndexedDB to localStorage
    window.checkForBackgroundNotificationsInIndexedDB = function() {
      return new Promise((resolve, reject) => {
        try {
          const DB_NAME = 'background_notifications_db';
          const STORE_NAME = 'notifications';
          
          const dbRequest = indexedDB.open(DB_NAME, 1);
          
          dbRequest.onupgradeneeded = function(event) {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            }
          };
          
          dbRequest.onerror = function(event) {
            console.error('Error opening IndexedDB:', event.target.error);
            resolve([]); // Return empty array on error
          };
          
          dbRequest.onsuccess = function(event) {
            try {
              const db = event.target.result;
              const transaction = db.transaction([STORE_NAME], 'readwrite');
              const store = transaction.objectStore(STORE_NAME);
              
              const request = store.getAll();
              
              request.onsuccess = function() {
                const notifications = request.result || [];
                console.log('Retrieved background notifications from IndexedDB:', notifications.length);
                
                if (notifications.length > 0) {
                  // Clear all notifications from store
                  const clearRequest = store.clear();
                  clearRequest.onsuccess = function() {
                    console.log('Successfully cleared IndexedDB notifications after retrieval');
                  };
                  
                  // Add to localStorage for our bridge
                  const storedNotifications = JSON.parse(localStorage.getItem('pending_notifications') || '[]');
                  
                  // Combine notifications
                  const allNotifications = [...storedNotifications, ...notifications];
                  
                  // Save back to localStorage
                  localStorage.setItem('pending_notifications', JSON.stringify(allNotifications));
                  localStorage.setItem('pending_notification_count', allNotifications.length.toString());
                  
                  console.log('Migrated IndexedDB notifications to localStorage:', notifications.length);
                }
                
                // Return the notifications we found
                resolve(notifications);
              };
              
              request.onerror = function(event) {
                console.error('Error retrieving notifications:', event.target.error);
                resolve([]); // Return empty array on error
              };
              
              transaction.oncomplete = function() {
                db.close();
              };
            } catch (e) {
              console.error('Error in IndexedDB transaction:', e);
              resolve([]); // Return empty on error
            }
          };
        } catch (e) {
          console.error('Error checking IndexedDB notifications:', e);
          resolve([]); // Return empty on error
        }
      });
    };
    
    // Enhanced version of getPendingNotifications that also checks IndexedDB
    window.getPendingNotifications = function() {
      return new Promise((resolve) => {

  <script>
    // Global notification handler that works more reliably
    const NOTIFICATIONS_KEY = 'padeltid_background_notifications';
    
    // Listen for messages from service worker
    navigator.serviceWorker.addEventListener('message', function(event) {
      console.log('[Client] Received message from SW:', event.data);
      
      if (event.data && event.data.type === 'STORE_BACKGROUND_NOTIFICATION') {
        console.log('[Client] Storing notification from SW:', event.data.notificationData);
        storeBackgroundNotification(event.data.notificationData);
      }
      
      if (event.data && event.data.type === 'NOTIFICATION_CLICKED') {
        console.log('[Client] Notification clicked:', event.data);
        // Mark as processed
        markNotificationProcessed(event.data.notificationId);
        
        // Handle navigation if available
        if (event.data.documentId && window._handleNotificationClick) {
          window._handleNotificationClick(event.data.documentId);
        }
      }
    });
    
    // Store a notification 
    function storeBackgroundNotification(notification) {
      try {
        // Get existing notifications
        let notifications = JSON.parse(localStorage.getItem(NOTIFICATIONS_KEY) || '[]');
        
        // Add the new notification
        notifications.push(notification);
        
        // Save back to localStorage
        localStorage.setItem(NOTIFICATIONS_KEY, JSON.stringify(notifications));
        
        // Set the total count for easier checking
        localStorage.setItem('notification_count', notifications.length);
        
        console.log('[Client] Saved notification, total:', notifications.length);
      } catch (e) {
        console.error('[Client] Error storing notification:', e);
      }
    }
    
    // Check for background notifications (this also retrieves and clears them)
    window.checkPendingNotifications = function() {
      const notifications = JSON.parse(localStorage.getItem(NOTIFICATIONS_KEY) || '[]');
      console.log('[Client] Checking pending notifications, found:', notifications.length);
      
      // Check IndexedDB too - this is async but will sync later
      checkIndexedDBNotifications();
      
      return JSON.stringify(notifications);
    };
    
    // Mark notification as processed
    function markNotificationProcessed(notificationId) {
      if (!notificationId) return;
      
      try {
        // Update in localStorage
        let notifications = JSON.parse(localStorage.getItem(NOTIFICATIONS_KEY) || '[]');
        const updated = notifications.map(n => {
          if (n.id === notificationId) {
            return {...n, processed: true};
          }
          return n;
        });
        
        localStorage.setItem(NOTIFICATIONS_KEY, JSON.stringify(updated));
        
        // Also update in IndexedDB if possible
        const dbPromise = indexedDB.open('padeltid_notifications_db', 1);
        dbPromise.onsuccess = function(event) {
          const db = event.target.result;
          const tx = db.transaction('notifications', 'readwrite');
          const store = tx.objectStore('notifications');
          
          const req = store.get(notificationId);
          req.onsuccess = function() {
            const notification = req.result;
            if (notification) {
              notification.processed = true;
              store.put(notification);
            }
          };
          
          tx.oncomplete = function() {
            db.close();
          };
        };
      } catch (e) {
        console.error('[Client] Error marking notification processed:', e);
      }
    }
    
    // Clear processed notifications - FIX FOR IDBKeyRange ISSUE
    window.clearProcessedNotifications = function() {
      try {
        // Clear from localStorage
        let notifications = JSON.parse(localStorage.getItem(NOTIFICATIONS_KEY) || '[]');
        const remaining = notifications.filter(n => !n.processed);
        
        localStorage.setItem(NOTIFICATIONS_KEY, JSON.stringify(remaining));
        localStorage.setItem('notification_count', remaining.length);
        
        // Clear from IndexedDB too - FIXED VERSION
        const dbPromise = indexedDB.open('padeltid_notifications_db', 1);
        dbPromise.onsuccess = function(event) {
          const db = event.target.result;
          
          // Make sure the store exists
          if (!db.objectStoreNames.contains('notifications')) {
            console.log('[Client] No notifications store found in DB');
            return;
          }
          
          const tx = db.transaction('notifications', 'readwrite');
          const store = tx.objectStore('notifications');
          
          // Use getAllKeys to get all notification IDs first
          const req = store.getAllKeys();
          
          req.onsuccess = function(event) {
            const allKeys = event.target.result || [];
            console.log('[Client] Found ' + allKeys.length + ' notifications to check for deletion');
            
            if (allKeys.length === 0) return;
            
            // For each key, get the notification and check if processed
            const deletePromises = [];
            
            allKeys.forEach(key => {
              const getReq = store.get(key);
              
              getReq.onsuccess = function() {
                const notification = getReq.result;
                // Only delete if processed is true
                if (notification && notification.processed === true) {
                  store.delete(key);
                  console.log('[Client] Deleted processed notification: ' + key);
                }
              };
            });
          };
          
          tx.oncomplete = function() {
            console.log('[Client] Completed notification cleanup');
            db.close();
          };
        };
      } catch (e) {
        console.error('[Client] Error clearing processed notifications:', e);
      }
    };
    
    // Check if there are any pending notifications
    window.hasPendingNotifications = function() {
      const count = parseInt(localStorage.getItem('notification_count') || '0');
      return count > 0;
    };
    
    // Function to check IndexedDB for notifications
    function checkIndexedDBNotifications() {
      try {
        const dbPromise = indexedDB.open('padeltid_notifications_db', 1);
        
        dbPromise.onupgradeneeded = function(event) {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('notifications')) {
            const store = db.createObjectStore('notifications', { keyPath: 'id' });
            // DO NOT create the 'processed' index - we'll use JavaScript filtering instead
          }
        };
        
        dbPromise.onsuccess = function(event) {
          const db = event.target.result;
          const tx = db.transaction('notifications', 'readwrite');
          const store = tx.objectStore('notifications');
          
          // Get ALL notifications - don't use index to filter
          const req = store.getAll();
          
          req.onsuccess = function() {
            const allNotifications = req.result || [];
            console.log('[Client] Found notifications in IndexedDB:', allNotifications.length);
            
            // Filter in JavaScript instead of using the index
            const unprocessedNotifications = allNotifications.filter(notif => notif.processed !== true);
            
            if (unprocessedNotifications.length > 0) {
              // Merge with localStorage notifications
              const existingNotifications = JSON.parse(localStorage.getItem(NOTIFICATIONS_KEY) || '[]');
              const combinedNotifications = [...existingNotifications, ...unprocessedNotifications];
              
              // Update localStorage
              localStorage.setItem(NOTIFICATIONS_KEY, JSON.stringify(combinedNotifications));
              localStorage.setItem('notification_count', combinedNotifications.length);
              
              console.log('[Client] Merged notifications from IndexedDB to localStorage');
              
              // Mark these as processed in IndexedDB
              unprocessedNotifications.forEach(notification => {
                notification.processed = true;
                store.put(notification);
              });
            }
          };
          
          tx.oncomplete = function() {
            db.close();
          };
        };
      } catch (e) {
        console.error('[Client] Error checking IndexedDB notifications:', e);
      }
    }
    
    // Run an initial check on page load
    checkIndexedDBNotifications();
  </script>

        // 3. Clear from IndexedDB
        const dbPromise = indexedDB.open('padeltid_notifications_db', 1);
        
        dbPromise.onsuccess = function(event) {
          const db = event.target.result;
          
          // Check if store exists
          if (!db.objectStoreNames.contains('notifications')) {
            return;
          }
          
          const tx = db.transaction('notifications', 'readwrite');
          const store = tx.objectStore('notifications');
          
          // Clear the entire store
          const clearReq = store.clear();
          
          clearReq.onsuccess = function() {
            console.log('[Client] Successfully cleared all notifications from IndexedDB');
          };
          
          tx.oncomplete = function() {
            db.close();
          };
        };
        
        // Also clear any notifications in the debug logs DB
        try {
          const logsDb = indexedDB.open('padeltid_debug_logs', 1);
          logsDb.onsuccess = function(event) {
            const db = event.target.result;
            if (db.objectStoreNames.contains('logs')) {
              const tx = db.transaction('logs', 'readwrite');
              const store = tx.objectStore('logs');
              store.clear();
            }
            db.close();
          };
        } catch (e) {
          console.error('[Client] Error clearing debug logs:', e);
        }
        
        return true;
      } catch (e) {
        console.error('[Client] Error in clearAllNotifications:', e);
        return false;
      }
    };
  </script>
  <script>
    // Flag to track if notifications were recently cleared
    let notificationsClearedTimestamp = 0;
    
    // When clearing all notifications, also set this flag
    const originalClearAll = window.clearAllNotifications;
    window.clearAllNotifications = function() {
      const result = originalClearAll ? originalClearAll() : true;
      notificationsClearedTimestamp = Date.now();
      return result;
    };
    
    // Helper to check if notifications were cleared recently
    window.wasNotificationsClearedRecently = function() {
      // Consider "recently" as within the last minute
      const ONE_MINUTE = 60 * 1000;
      return (Date.now() - notificationsClearedTimestamp) < ONE_MINUTE;
    };
  </script>
  <script>
    // Function to completely remove a notification by ID from all storage
    window.removeNotificationById = function(id) {
      if (!id) return false;
      
      console.log('[Client] Removing notification by ID:', id);
      
      try {
        // 1. Remove from localStorage
        let notifications = JSON.parse(localStorage.getItem(NOTIFICATIONS_KEY) || '[]');
        const initialLength = notifications.length;
        
        notifications = notifications.filter(n => n.id !== id);
        
        localStorage.setItem(NOTIFICATIONS_KEY, JSON.stringify(notifications));
        localStorage.setItem('notification_count', notifications.length);
        
        // 2. Remove from IndexedDB
        const dbPromise = indexedDB.open('padeltid_notifications_db', 1);
        
        dbPromise.onsuccess = function(event) {
          const db = event.target.result;
          
          // Check if store exists
          if (!db.objectStoreNames.contains('notifications')) {
            return;
          }
          
          const tx = db.transaction('notifications', 'readwrite');
          const store = tx.objectStore('notifications');
          
          // Delete the notification by ID
          const deleteReq = store.delete(id);
          
          deleteReq.onsuccess = function() {
            console.log('[Client] Successfully removed notification from IndexedDB:', id);
          };
          
          tx.oncomplete = function() {
            db.close();
          };
        };
        
        return initialLength !== notifications.length; // Return true if removed
      } catch (e) {
        console.error('[Client] Error removing notification by ID:', e);
        return false;
      }
    };
  </script>
