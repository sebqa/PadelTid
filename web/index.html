<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- Performance hints -->
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://www.gstatic.com">

  <!-- Preload critical resources -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="flutter.js" as="script">
  <link rel="preload" href="assets/icon/logo.svg" as="image">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PADELTID">

  <!-- iOS meta tags & icons -->
  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PADELTID">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Add these lines for favicon/tab icon support -->
  <link rel="icon" type="image/svg+xml" href="assets/icon/logo.svg">
  <link rel="alternate icon"  type="image/svg+xml" href="assets/icon/logo.svg">
  <link rel="mask-icon" href="assets/icon/logo.svg" color="#00875A">
  <link rel="apple-touch-icon" href="assets/icon/logo.svg">

  <title>PADELTID</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Firebase Scripts -->
  <script type="module" async>
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.9.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.9.1/firebase-analytics.js";
    import { getMessaging } from "https://www.gstatic.com/firebasejs/9.9.1/firebase-messaging.js";
  </script>
  
  <!-- Flutter initialization -->
  <script src="flutter.js"></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      var loading = document.createElement('div');
      loading.style.display = 'none';
      document.body.appendChild(loading);
      
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: '{{flutter_service_worker_version}}',
        },
        onEntrypointLoaded: async function(engineInitializer) {
          loading.remove();
          let appRunner = await engineInitializer.initializeEngine({
            // Optimize initial load
            useColorEmoji: false,
            renderer: "html"
          });
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
