<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">


  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PADELTID">
  <meta name="theme-color" content="#00875A">

  <!-- iOS meta tags & icons -->
  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PADELTID">
  <link rel="apple-touch-icon" href="assets/icon/maskable_logo.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icon/maskable_logo.svg"/>

  <!-- Add these lines for favicon/tab icon support -->
  <link rel="icon" type="image/svg+xml" href="assets/icon/logo.svg">
  <link rel="alternate icon"  type="image/svg+xml" href="assets/icon/logo.svg">
  <link rel="mask-icon"  type="image/svg+xml" href="assets/icon/logo.svg" color="#00875A">
  <link rel="apple-touch-icon" type="image/svg+xml" href="assets/icon/logo.svg">

  <title>PADELTID</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #00875A;
    }

    .initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease-out;
    }

    .initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      margin: 0 4px;
      background: white;
      border-radius: 50%;
      animation: dot-fade 1s infinite;
    }

    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-fade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
  

  <script>
    // Prevent going back past the initial page
    if (window.history.scrollRestoration) {
      window.history.scrollRestoration = 'manual';
    }
    
    let initialPage = window.location.href;
    
    window.addEventListener('load', function() {
      // Push initial state
      window.history.pushState({ initial: true }, '', initialPage);
    });

    window.addEventListener('popstate', function(event) {
      // If trying to go back from initial page, prevent it
      if (window.location.href === initialPage) {
        window.history.pushState(null, '', initialPage);
      }
    });
  </script>

  <!-- Flutter initialization -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="initial-loader">
    <div style="display: flex;">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>
  <script>
    window.addEventListener('load', function() {
      // Get the loader element
      const loader = document.querySelector('.initial-loader');
      
      // Initialize Flutter
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();
          
          // Hide loader after Flutter is initialized
          loader.classList.add('hidden');
          // Remove loader from DOM after transition
          setTimeout(() => loader.remove(), 300);
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
