<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">


  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PADELTID">
  <meta name="theme-color" content="#00875A">

  <!-- iOS meta tags & icons -->
  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PADELTID">
  <link rel="apple-touch-icon" href="assets/icon/maskable_logo.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icon/maskable_logo.svg"/>

  <!-- Add these lines for favicon/tab icon support -->
  <link rel="icon" type="image/svg+xml" href="assets/icon/logo.svg">
  <link rel="alternate icon"  type="image/svg+xml" href="assets/icon/logo.svg">
  <link rel="mask-icon" href="assets/icon/logo.svg" color="#00875A">
  <link rel="apple-touch-icon" href="assets/icon/logo.svg">

  <title>PADELTID</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #00875A;
    }

    .initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loading-icon {
      width: 96px;
      height: 96px;
      animation: icon-pulse 1.5s ease-in-out infinite;
    }

    @keyframes icon-pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
  

  <!-- Flutter initialization -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="initial-loader">
    <img src="assets/icon/logo.svg" class="loading-icon" alt="Loading...">
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
